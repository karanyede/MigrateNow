<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — MigrateNow</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/MigrateNow_Favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=12">
    <style>
        body {
            background: var(--surface-0);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.4s var(--t-slow) both;
        }
        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .login-logo img {
            height: 48px;
            object-fit: contain;
        }
        .login-card {
            background: var(--surface-2);
            border: 1px solid var(--border-moderate);
            border-radius: var(--radius-md);
            padding: 2.25rem 2rem;
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }
        .login-card__title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            text-align: center;
        }
        .login-card__subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .input-wrapper {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .form-input {
            width: 100%;
            height: 40px;
            padding: 0 1rem 0 2.25rem;
            box-sizing: border-box;
            background: var(--surface-3);
            border: 1px solid var(--border-moderate);
            border-radius: var(--radius-xs);
            color: var(--text-primary);
            font-size: 0.88rem;
            outline: none;
            transition: all var(--t-fast);
        }
        .form-input:focus {
            border-color: var(--border-active);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 1.25rem 0 1.75rem;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }
        .checkbox-label input {
            cursor: pointer;
            accent-color: var(--violet);
        }
        .btn-submit {
            width: 100%;
            height: 42px;
            background: var(--grad-brand);
            border: none;
            border-radius: var(--radius-xs);
            color: #fff;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--t-base);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(124, 58, 237, 0.4);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .alert-banner {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.25);
            color: #ff8a80;
            border-radius: var(--radius-xs);
            padding: 0.75rem 1rem;
            font-size: 0.82rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            animation: shake 0.35s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="login-logo">
            <img src="{{ url_for('static', filename='images/MigrateNow_Logo.png') }}" alt="MigrateNow">
        </div>

        <div class="login-card">
            <div class="login-card__title">Sign In</div>
            <div class="login-card__subtitle">Access your enterprise migration dashboard</div>

            <!-- Flash alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert-banner">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0;margin-top:1px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
                            </svg>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login_page') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                        </svg>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Enter username" value="{{ username }}" required autocomplete="username" autofocus>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:0.5rem;">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                        </svg>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                </div>

                <div class="checkbox-row">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>
        </div>

    </div>

</body>
</html>
